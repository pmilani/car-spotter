<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Spotter</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6d6b66;--line:#e2dfd8;--acc:#c8401e;--ok:#2e7d4f;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1d;--ink:#f1efe9;--mute:#9b978e;--line:#34312d;--acc:#ef6a43;--ok:#5cc08a;--warn:#e0b04f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.on{background:var(--ink);color:var(--bg)}button:disabled{opacity:.5}
main{max-width:1000px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--card)}
.th img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}.badge.z{background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mute{color:var(--mute);font-size:13px}
.det{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}@media(min-width:760px){.det{grid-template-columns:1.1fr 1fr}}
.det>div>img{width:100%;border-radius:12px;border:1px solid var(--line)}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tag{font-size:12px;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}
.tag.confirmed{color:var(--ok);border-color:var(--ok)}.tag.suggested{color:var(--warn);border-color:var(--warn)}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}#msg{color:var(--acc);font-size:13px;margin:6px 0}
.mini{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.fr{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-top:6px}
</style></head><body>
<header><h1>🚗 Car Spotter</h1>
<button id="t-photos" class="on">Photos</button><button id="t-cars">Cars</button>
<button id="reload">↻ Reload album</button><button id="auth" class="p">Sign in with Google</button></header>
<main><div id="msg"></div><div id="view"></div></main>
<script>
const showErr=t=>{const m=document.getElementById('msg');if(m)m.textContent=t};
addEventListener('error',e=>showErr('Script error: '+(e.message||('could not load '+(e.target&&e.target.src)))),true);
addEventListener('unhandledrejection',e=>showErr('Error: '+((e.reason&&e.reason.message)||e.reason)));
if(location.protocol==='file:')showErr('Open the GitHub Pages site (or a local static server), not the HTML file directly.');
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
import {API_URL} from './api-config.js';
const api = API_URL.replace(/\/$/, '');
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='on')for(const[ev,fn]of Object.entries(v))e.addEventListener(ev,fn);else if(a==='text')e.textContent=v;else if(a in e)try{e[a]=v}catch(_){}else e.setAttribute(a,v)}k.flat().forEach(c=>c!=null&&e.append(c.nodeType?c:document.createTextNode(c)));return e};
if(/PASTE/.test(JSON.stringify(firebaseConfig)))showErr('Fill in public/firebase-config.js with your Firebase web app values, then reload.');
const S={showVideos:true,showHidden:false,hidden:{},tab:'photos',photos:[],cars:[],sel:null,user:null,ai:{}};
const flash=t=>$('#msg').textContent=t||'';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let unsub=null,unsub2=null;
const rid=()=>Math.random().toString(36).slice(2,10);
const photo=g=>S.photos.find(p=>p.guid===g);

$('#auth').onclick=()=>S.user?signOut(auth):signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>flash('Sign-in failed: '+(e.code||'')+' '+e.message));
onAuthStateChanged(auth,u=>{
  S.user=u;$('#auth').textContent=u?`Sign out (${u.displayName||u.email})`:'Sign in with Google';
  unsub&&unsub();unsub2&&unsub2();unsub=unsub2=null;S.cars=[];S.hidden={};
  if(u){unsub2=onSnapshot(collection(db,'hidden'),s=>{S.hidden={};s.docs.forEach(d=>S.hidden[d.id]=1);render()},e=>flash('Hidden list: '+e.message+' (paste the updated firestore.rules and Publish)'));unsub=onSnapshot(collection(db,'cars'),s=>{S.cars=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));render()},e=>flash('Database: '+e.message+' (is your email in firestore.rules?)'));loadAlbum()}
  render();
});
async function loadAlbum(){flash('Loading album from iCloud…');
  try{const r=await fetch(`${api}/api/album`),j=await r.json();if(!r.ok)throw new Error(j.error);S.photos=j;flash('')}catch(e){flash('Album: '+e.message)}render()}
$('#reload').onclick=async()=>{await fetch(`${api}/api/album?refresh=1`);loadAlbum()};

const toggleHide=p=>{const was=!!S.hidden[p.guid];was?deleteDoc(doc(db,'hidden',p.guid)):setDoc(doc(db,'hidden',p.guid),{by:S.user.email,ts:Date.now()});if(!was&&!S.showHidden){S.sel=null;render()}};
const saveCar=(id,d)=>setDoc(doc(db,'cars',id),{...d,ts:Date.now(),by:d.by||S.user.email});
const FIELDS=[['make','Make'],['model','Model'],['era','Era'],['category','Category'],['livery','Livery'],['chassis','Specific chassis'],['team','Team / driver']];
const val=(c,k)=>c[k]??(k==='era'?c.year:k==='livery'?c.color:'')??'';
const newCar=(g,pre={})=>{const d={status:'suggested',notes:pre.clues?'AI clues: '+pre.clues:'',photoGuids:g?[g]:[]};
  FIELDS.forEach(([k])=>{const f=pre[k]||{};d[k]=String(f.value||'')});return saveCar(rid(),d)};
let copied=null;
async function copyUrl(p){const u=p.full||p.url;try{await navigator.clipboard.writeText(u)}catch(_){prompt('Copy this link:',u)}copied=p.guid;render();setTimeout(()=>{copied=null;render()},1500)}

function carForm(c){
  const pg=c.photoGuids||[];
  const row=([k,l])=>h('div',{class:'fr'},h('span',{class:'mute',text:l}),
    h('input',{value:val(c,k),on:{change:e=>saveCar(c.id,{...c,[k]:e.target.value})}}));
  return h('div',{class:'card'},
    h('div',{class:'row'},h('b',{text:[c.make,c.model].filter(Boolean).join(' ')||'Unnamed car'}),h('span',{class:'tag '+c.status,text:c.status}),h('span',{class:'mute',text:c.by||''})),
    h('div',{class:'row',style:'margin:8px 0'},pg.map(photo).filter(Boolean).map(p=>h('img',{class:'mini',src:p.url,on:{click:()=>{S.sel=p.guid;S.tab='photos';render()}}}))),
    FIELDS.map(row),
    h('div',{class:'fr'},h('span',{class:'mute',text:'Status'}),h('select',{on:{change:e=>saveCar(c.id,{...c,status:e.target.value})}},['suggested','confirmed'].map(o=>h('option',{value:o,text:o,selected:o===c.status})))),
    h('label',{text:'Notes'}),h('textarea',{rows:2,value:c.notes||'',on:{change:e=>saveCar(c.id,{...c,notes:e.target.value})}}),
    h('div',{class:'row',style:'margin-top:8px'},
      S.sel&&!pg.includes(S.sel)?h('button',{text:'Link to this photo',on:{click:()=>saveCar(c.id,{...c,photoGuids:[...pg,S.sel]})}}):null,
      S.sel&&pg.includes(S.sel)?h('button',{text:'Unlink from photo',on:{click:()=>saveCar(c.id,{...c,photoGuids:pg.filter(x=>x!==S.sel)})}}):null,
      h('button',{text:'Delete car',on:{click:()=>confirm('Delete this car?')&&deleteDoc(doc(db,'cars',c.id))}})))}
function detail(p){
  const mine=S.cars.filter(c=>(c.photoGuids||[]).includes(p.guid)),others=S.cars.filter(c=>!(c.photoGuids||[]).includes(p.guid)),ai=S.ai[p.guid];
  return h('div',{},h('div',{class:'row',style:'margin-bottom:10px'},h('button',{text:'← Back',on:{click:()=>{S.sel=null;render()}}}),p.video?h('span',{class:'mute',text:'Video (showing poster frame)'}):null,h('span',{style:'flex:1'}),h('button',{text:S.hidden[p.guid]?'Unhide photo':'Hide photo',on:{click:()=>toggleHide(p)}})),
    h('div',{class:'det'},h('div',{},h('img',{src:p.url})),h('div',{},
      h('div',{class:'card'},h('div',{class:'row'},h('button',{class:'p',text:copied===p.guid?'Copied ✓':'Copy image URL',on:{click:()=>copyUrl(p)}}),h('button',{text:'+ Add car',on:{click:()=>newCar(p.guid)}})),h('p',{class:'mute',text:'The link expires after a while, so paste it into your AI tool soon after copying.'})),
      mine.length?mine.map(carForm):h('p',{class:'mute',text:'No cars logged on this photo yet.'}),
      others.length?h('div',{class:'card'},h('label',{text:'Same car as one already logged? Link it'}),h('select',{on:{change:e=>{const c=S.cars.find(x=>x.id===e.target.value);if(c)saveCar(c.id,{...c,photoGuids:[...(c.photoGuids||[]),p.guid]})}}},h('option',{value:'',text:'Choose a car…'}),others.map(c=>h('option',{value:c.id,text:[c.make,c.model,val(c,'livery')].filter(Boolean).join(' ')||c.id})))):null)))}
function render(){
  $('#t-photos').className=S.tab==='photos'?'on':'';$('#t-cars').className=S.tab==='cars'?'on':'';
  const v=$('#view');v.replaceChildren();
  if(!S.user){v.append(h('div',{class:'empty',text:'Sign in with your Google account to open the shared log.'}));return}
  if(S.tab==='cars'){if(!S.cars.length)v.append(h('div',{class:'empty',text:'No cars logged yet. Open a photo to start.'}));S.cars.forEach(c=>v.append(carForm(c)));return}
  const p=photo(S.sel);if(p){v.append(detail(p));return}
  if(!S.photos.length){v.append(h('div',{class:'empty',text:'No photos loaded yet.'}));return}
  const vis=S.photos.filter(p=>(S.showVideos||!p.video)&&(S.showHidden||!S.hidden[p.guid]));
  const has=p=>S.cars.some(c=>(c.photoGuids||[]).includes(p.guid));
  const done=vis.filter(has).length,nH=S.photos.filter(p=>S.hidden[p.guid]).length,nV=S.photos.filter(p=>p.video).length;
  const cb=(l,k)=>h('label',{style:'display:inline-flex;gap:6px;align-items:center;margin:0 14px 0 0;font-size:14px;color:var(--ink)'},h('input',{type:'checkbox',checked:S[k],style:'width:auto',on:{change:e=>{S[k]=e.target.checked;render()}}}),l);
  v.append(h('div',{class:'row',style:'margin-bottom:6px'},cb(`Show videos (${nV})`,'showVideos'),cb(`Show hidden (${nH})`,'showHidden')),
    h('p',{class:'mute',text:`${done} of ${vis.length} shown photos have cars logged · ${S.cars.length} cars (${S.cars.filter(c=>c.status==='confirmed').length} confirmed)`}),
    vis.length?h('div',{class:'grid'},vis.map(p=>{const n=S.cars.filter(c=>(c.photoGuids||[]).includes(p.guid)).length,hid=S.hidden[p.guid];
      return h('div',{class:'th',style:hid?'opacity:.45':'',on:{click:()=>{S.sel=p.guid;render()}}},h('img',{src:p.url,loading:'lazy'}),
        p.video?h('span',{class:'badge',style:'right:auto;left:6px;bottom:auto;top:6px',text:'▶ video'}):null,
        h('span',{class:'badge'+(n||hid?'':' z'),text:hid?'hidden':(n?n+' 🚗':'todo')}))})):h('div',{class:'empty',text:'Nothing to show with these filters.'}))}
$('#t-photos').onclick=()=>{S.tab='photos';S.sel=null;render()};$('#t-cars').onclick=()=>{S.tab='cars';render()};
render();
</script></body></html>
