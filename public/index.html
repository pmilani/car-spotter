<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Spotter</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6d6b66;--line:#e2dfd8;--acc:#c8401e;--ok:#2e7d4f;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1d;--ink:#f1efe9;--mute:#9b978e;--line:#34312d;--acc:#ef6a43;--ok:#5cc08a;--warn:#e0b04f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.on{background:var(--ink);color:var(--bg)}button:disabled{opacity:.5}
main{max-width:1000px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--card)}
.th img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}.badge.z{background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mute{color:var(--mute);font-size:13px}
.det{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}@media(min-width:760px){.det{grid-template-columns:1.1fr 1fr}}
.det>div>img{width:100%;border-radius:12px;border:1px solid var(--line)}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
#albumSel{width:auto;max-width:220px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tag{font-size:12px;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}
.tag.confirmed{color:var(--ok);border-color:var(--ok)}.tag.suggested{color:var(--warn);border-color:var(--warn)}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}#msg{color:var(--acc);font-size:13px;margin:6px 0}
.mini{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.fr{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-top:6px}
.grow{flex:1;min-width:150px}
</style></head><body>
<header><h1>🚗 Car Spotter</h1>
<select id="albumSel" title="Current album"></select>
<button id="t-photos" class="on">Photos</button><button id="t-cars">Cars</button><button id="t-albums">Albums</button>
<button id="reload">↻ Reload photos</button><button id="auth" class="p">Sign in with Google</button></header>
<main><div id="msg"></div><div id="view"></div></main>
<script>
const showErr=t=>{const m=document.getElementById('msg');if(m)m.textContent=t};
addEventListener('error',e=>showErr('Script error: '+(e.message||('could not load '+(e.target&&e.target.src)))),true);
addEventListener('unhandledrejection',e=>showErr('Error: '+((e.reason&&e.reason.message)||e.reason)));
if(location.protocol==='file:')showErr('Open the GitHub Pages site (or a local static server), not the HTML file directly.');
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
import {API_URL} from './api-config.js';
const api = API_URL.replace(/\/$/, '');
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='on')for(const[ev,fn]of Object.entries(v))e.addEventListener(ev,fn);else if(a==='text')e.textContent=v;else if(a in e)try{e[a]=v}catch(_){}else e.setAttribute(a,v)}k.flat().forEach(c=>c!=null&&e.append(c.nodeType?c:document.createTextNode(c)));return e};
if(/PASTE/.test(JSON.stringify(firebaseConfig)))showErr('Fill in public/firebase-config.js with your Firebase web app values, then reload.');

const API_RETRY_DELAYS=[2000,4000,8000,12000,15000,15000,15000];
async function fetchApiJson(url,onRetry=()=>{}){
  const deadline=Date.now()+90000;let lastError;
  for(let attempt=1;attempt<=API_RETRY_DELAYS.length+1;attempt++){
    const remaining=deadline-Date.now();if(remaining<=0)break;
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),Math.min(12000,remaining));
    try{
      const r=await fetch(url,{signal:controller.signal});
      if(r.ok)return await r.json();
      const body=await r.json().catch(()=>({})),e=new Error(body.error||`Photo service returned ${r.status}`);
      if(r.status!==408&&r.status!==429&&r.status<500)throw e;
      lastError=e;
    }catch(e){
      if(e.name==='AbortError'||e instanceof TypeError)lastError=e;
      else throw e;
    }finally{clearTimeout(timeout)}
    if(attempt>API_RETRY_DELAYS.length)break;
    const wait=Math.min(API_RETRY_DELAYS[attempt-1],deadline-Date.now());if(wait<=0)break;
    onRetry(attempt+1,Math.ceil(wait/1000));
    await new Promise(resolve=>setTimeout(resolve,wait));
  }
  const reason=lastError?.name==='AbortError'?'request timed out':lastError?.message||'network error';
  throw new Error(`Photo service is still unavailable after automatic retries (${reason}). Try again in a moment.`);
}

// ---- photo source types. To add a new type: add an entry here (parse the user's input, fetch photos) and a handler in server.js.
const SOURCE_TYPES={
  icloud:{id:'icloud',name:'iCloud shared album',placeholder:'https://www.icloud.com/sharedalbum/#…',
      parse(input) {
          input = (input || '').trim();
          if (!input) throw new Error('Paste the shared album link');
          if (/share\.icloud\.com/i.test(input)) throw new Error('Only classic shared-album links (icloud.com/sharedalbum/#…) are supported');
          const t = input.includes('#') ? input.split('#').pop().trim() : input;
          if (!/^[A-Za-z0-9-_]{6,99}$/.test(t)) throw new Error('Could not find an album token in that link');
          return {token: t}
      },
    async fetch(s,refresh,onRetry){return fetchApiJson(`${api}/api/source?type=icloud&token=${encodeURIComponent(s.token)}${refresh?'&refresh=1':''}`,onRetry)}}
};

const S={showVideos:false,showHidden:false,hidden:{},tab:'photos',photos:[],cars:[],albums:[],albumId:null,loadedKey:null,sel:null,user:null,draft:{newName:'',src:{}}};
try{S.albumId=localStorage.getItem('cs.album')||null}catch(_){}
const store=()=>{try{localStorage.setItem('cs.album',S.albumId||'')}catch(_){}};
const flash=t=>$('#msg').textContent=t||'';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let unsubs=[];
const rid=()=>Math.random().toString(36).slice(2,10);
const photo=g=>S.photos.find(p=>p.guid===g);
const curAlbum=()=>S.albums.find(a=>a.id===S.albumId);
const carsHere=()=>S.cars.filter(c=>c.albumId===S.albumId);
const hid=p=>!!S.hidden[S.albumId+'__'+p.guid];
async function runBatch(ops){for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}}

$('#auth').onclick=()=>S.user?signOut(auth):signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>flash('Sign-in failed: '+(e.code||'')+' '+e.message));
onAuthStateChanged(auth,u=>{
  S.user=u;$('#auth').textContent=u?`Sign out (${u.displayName||u.email})`:'Sign in with Google';
  unsubs.forEach(f=>f());unsubs=[];S.cars=[];S.hidden={};S.albums=[];S.photos=[];S.loadedKey=null;
  if(u){
    const err=n=>e=>flash(`${n}: ${e.message} (is your email in firestore.rules, and does it allow "${n.toLowerCase()}"?)`);
    unsubs.push(onSnapshot(collection(db,'hidden'),s=>{S.hidden={};s.docs.forEach(d=>S.hidden[d.id]=1);render()},err('Hidden')));
    unsubs.push(onSnapshot(collection(db,'cars'),s=>{S.cars=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));render()},err('Cars')));
    unsubs.push(onSnapshot(collection(db,'albums'),s=>{
      S.albums=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      if(!curAlbum()){S.albumId=(S.albums[0]||{}).id||null;store()}
      syncAlbum();render()},err('Albums')));
  }
  render();
});

// ---- loading photos for the current album (all of its sources, merged)
let loadSeq=0;
function syncAlbum(){const key=S.albumId+'|'+JSON.stringify((curAlbum()||{}).sources||[]);if(key===S.loadedKey)return;S.loadedKey=key;S.sel=null;loadPhotos()}
async function loadPhotos(refresh=false){
  const a=curAlbum(),seq=++loadSeq;
  if(!a||!(a.sources||[]).length){S.photos=[];flash('');render();return}
  flash('Loading photos…');
  const res=await Promise.all(a.sources.map(async s=>{try{const T=SOURCE_TYPES[s.type];if(!T)throw new Error('Unsupported source type '+s.type);return{s,photos:await T.fetch(s,refresh,(attempt,delay)=>flash(`Photo service is waking up. Retrying in ${delay}s (attempt ${attempt}/8)…`))}}catch(e){return{s,error:e.message}}}));
  if(seq!==loadSeq)return;
  const seen=new Set();S.photos=[];
  res.forEach(r=>(r.photos||[]).forEach(p=>{if(!seen.has(p.guid)){seen.add(p.guid);S.photos.push({...p,src:r.s.label||r.s.type})}}));
  const errs=res.filter(r=>r.error).map(r=>`${r.s.label||r.s.type}: ${r.error}`);
  flash(errs.length?'Some sources failed: '+errs.join(' | '):'');render()}
$('#reload').onclick=()=>loadPhotos(true);

// ---- album management
const albumRest=a=>{const{id,...rest}=a;return rest};
const saveAlbum=(a,patch)=>setDoc(doc(db,'albums',a.id),{...albumRest(a),...patch,ts:Date.now()});
function openAlbum(id){S.albumId=id;store();S.sel=null;S.tab='photos';syncAlbum();render()}
async function createAlbum(){
  const name=S.draft.newName.trim();if(!name){flash('Give the album a name.');return}
  const id=rid();S.albumId=id;store();S.draft.newName='';
  try{await setDoc(doc(db,'albums',id),{name,sources:[],by:S.user.email,ts:Date.now()});flash('Album created. Add a photo source below.')}catch(e){flash('Could not create album: '+e.message)}}
async function addSource(a){
  const d=S.draft.src[a.id]||{},T=SOURCE_TYPES[d.type||'icloud'];
  try{const cfg=T.parse(d.link);flash('Checking source…');const photos=await T.fetch(cfg,true,(attempt,delay)=>flash(`Photo service is waking up. Retrying in ${delay}s (attempt ${attempt}/8)…`));
    const s={id:rid(),type:T.id,label:(d.label||'').trim()||`${T.name} (${photos.length} photos)`,...cfg};
    await saveAlbum(a,{sources:[...(a.sources||[]),s]});S.draft.src[a.id]={type:T.id,label:'',link:''};flash(`Added source with ${photos.length} photos.`)}
  catch(e){flash('Could not add source: '+e.message)}}
const removeSource=(a,s)=>confirm(`Remove source "${s.label||s.type}" from "${a.name}"? Cars already logged stay in the album.`)&&saveAlbum(a,{sources:a.sources.filter(x=>x.id!==s.id)});
async function delAlbum(a){
  const cs=S.cars.filter(c=>c.albumId===a.id);
  if(!confirm(`Delete album "${a.name}"? This also deletes its ${cs.length} logged car(s). Photos in iCloud are not touched.`))return;
  const ops=cs.map(c=>b=>b.delete(doc(db,'cars',c.id)));
  Object.keys(S.hidden).filter(k=>k.startsWith(a.id+'__')).forEach(k=>ops.push(b=>b.delete(doc(db,'hidden',k))));
  ops.push(b=>b.delete(doc(db,'albums',a.id)));
  try{await runBatch(ops)}catch(e){flash('Delete failed: '+e.message)}}
const legacyHidden=()=>Object.keys(S.hidden).filter(k=>!k.includes('__'));
async function adopt(){
  const ops=[];S.cars.filter(c=>!c.albumId).forEach(c=>ops.push(b=>b.update(doc(db,'cars',c.id),{albumId:S.albumId})));
  legacyHidden().forEach(k=>{ops.push(b=>b.set(doc(db,'hidden',S.albumId+'__'+k),{by:S.user.email,ts:Date.now(),albumId:S.albumId,guid:k}));ops.push(b=>b.delete(doc(db,'hidden',k)))});
  try{await runBatch(ops);flash('Moved into this album.')}catch(e){flash('Could not move: '+e.message)}}

// ---- cars
const toggleHide=p=>{const id=S.albumId+'__'+p.guid,was=hid(p);was?deleteDoc(doc(db,'hidden',id)):setDoc(doc(db,'hidden',id),{by:S.user.email,ts:Date.now(),albumId:S.albumId,guid:p.guid});if(!was&&!S.showHidden){S.sel=null;render()}};
const saveCar=(id,d)=>setDoc(doc(db,'cars',id),{...d,ts:Date.now(),by:d.by||S.user.email});
const FIELDS=[['make','Make'],['model','Model'],['era','Era'],['category','Category'],['livery','Livery'],['chassis','Specific chassis'],['team','Team / driver']];
const val=(c,k)=>c[k]??(k==='era'?c.year:k==='livery'?c.color:'')??'';
const newCar=(g,pre={})=>{const d={albumId:S.albumId,status:'suggested',notes:pre.clues?'AI clues: '+pre.clues:'',photoGuids:g?[g]:[]};
  FIELDS.forEach(([k])=>{const f=pre[k]||{};d[k]=String(f.value||'')});return saveCar(rid(),d)};
let copied=null;
async function copyUrl(p){const u=p.full||p.url;try{await navigator.clipboard.writeText(u)}catch(_){prompt('Copy this link:',u)}copied=p.guid;render();setTimeout(()=>{copied=null;render()},1500)}

function carForm(c){
  const pg=c.photoGuids||[];
  const row=([k,l])=>h('div',{class:'fr'},h('span',{class:'mute',text:l}),
    h('input',{value:val(c,k),on:{change:e=>saveCar(c.id,{...c,[k]:e.target.value})}}));
  return h('div',{class:'card'},
    h('div',{class:'row'},h('b',{text:[c.make,c.model].filter(Boolean).join(' ')||'Unnamed car'}),h('span',{class:'tag '+c.status,text:c.status}),h('span',{class:'mute',text:c.by||''})),
    h('div',{class:'row',style:'margin:8px 0'},pg.map(photo).filter(Boolean).map(p=>h('img',{class:'mini',src:p.url,on:{click:()=>{S.sel=p.guid;S.tab='photos';render()}}}))),
    FIELDS.map(row),
    h('div',{class:'fr'},h('span',{class:'mute',text:'Status'}),h('select',{on:{change:e=>saveCar(c.id,{...c,status:e.target.value})}},['suggested','confirmed'].map(o=>h('option',{value:o,text:o,selected:o===c.status})))),
    h('label',{text:'Notes'}),h('textarea',{rows:2,value:c.notes||'',on:{change:e=>saveCar(c.id,{...c,notes:e.target.value})}}),
    h('div',{class:'row',style:'margin-top:8px'},
      S.sel&&!pg.includes(S.sel)?h('button',{text:'Link to this photo',on:{click:()=>saveCar(c.id,{...c,photoGuids:[...pg,S.sel]})}}):null,
      S.sel&&pg.includes(S.sel)?h('button',{text:'Unlink from photo',on:{click:()=>saveCar(c.id,{...c,photoGuids:pg.filter(x=>x!==S.sel)})}}):null,
      h('button',{text:'Delete car',on:{click:()=>confirm('Delete this car?')&&deleteDoc(doc(db,'cars',c.id))}})))}
function detail(p){
  const here=carsHere(),mine=here.filter(c=>(c.photoGuids||[]).includes(p.guid)),others=here.filter(c=>!(c.photoGuids||[]).includes(p.guid));
  const multi=((curAlbum()||{}).sources||[]).length>1;
  return h('div',{},h('div',{class:'row',style:'margin-bottom:10px'},h('button',{text:'← Back',on:{click:()=>{S.sel=null;render()}}}),p.video?h('span',{class:'mute',text:'Video (showing poster frame)'}):null,multi?h('span',{class:'mute',text:'Source: '+p.src}):null,h('span',{style:'flex:1'}),h('button',{text:hid(p)?'Unhide photo':'Hide photo',on:{click:()=>toggleHide(p)}})),
    h('div',{class:'det'},h('div',{},h('img',{src:p.url})),h('div',{},
      h('div',{class:'card'},h('div',{class:'row'},h('button',{class:'p',text:copied===p.guid?'Copied ✓':'Copy image URL',on:{click:()=>copyUrl(p)}}),h('button',{text:'+ Add car',on:{click:()=>newCar(p.guid)}})),h('p',{class:'mute',text:'The link expires after a while, so paste it into your AI tool soon after copying.'})),
      mine.length?mine.map(carForm):h('p',{class:'mute',text:'No cars logged on this photo yet.'}),
      others.length?h('div',{class:'card'},h('label',{text:'Same car as one already logged? Link it'}),h('select',{on:{change:e=>{const c=S.cars.find(x=>x.id===e.target.value);if(c)saveCar(c.id,{...c,photoGuids:[...(c.photoGuids||[]),p.guid]})}}},h('option',{value:'',text:'Choose a car…'}),others.map(c=>h('option',{value:c.id,text:[c.make,c.model,val(c,'livery')].filter(Boolean).join(' ')||c.id})))):null)))}

// ---- albums screen
function albumsView(){
  const w=h('div',{});
  w.append(h('div',{class:'card'},h('b',{text:'New album'}),h('div',{class:'row',style:'margin-top:8px'},
    h('input',{class:'grow',placeholder:'Album name, e.g. Goodwood 2025',value:S.draft.newName,on:{input:e=>S.draft.newName=e.target.value,keydown:e=>e.key==='Enter'&&createAlbum()}}),
    h('button',{class:'p',text:'Create album',on:{click:createAlbum}}))));
  if(!S.albums.length)w.append(h('div',{class:'empty',text:'No albums yet. Create one above, then add a photo source to it.'}));
  S.albums.forEach(a=>w.append(albumCard(a)));return w}
function albumCard(a){
  const d=S.draft.src[a.id]||(S.draft.src[a.id]={type:'icloud',label:'',link:''});
  const n=S.cars.filter(c=>c.albumId===a.id).length,srcs=a.sources||[];
  return h('div',{class:'card'},
    h('div',{class:'row'},h('input',{class:'grow',style:'font-weight:600',value:a.name||'',on:{change:e=>saveAlbum(a,{name:e.target.value.trim()||a.name})}}),
      a.id===S.albumId?h('span',{class:'tag confirmed',text:'current'}):h('button',{text:'Open',on:{click:()=>openAlbum(a.id)}}),
      h('button',{text:'Delete album',on:{click:()=>delAlbum(a)}})),
    h('p',{class:'mute',text:`${n} car(s) logged · ${srcs.length} photo source(s)`}),
    srcs.map(s=>h('div',{class:'row',style:'margin:6px 0'},h('span',{class:'tag',text:(SOURCE_TYPES[s.type]||{}).name||s.type}),h('span',{text:s.label||''}),h('span',{style:'flex:1'}),h('button',{text:'Remove',on:{click:()=>removeSource(a,s)}}))),
    h('label',{text:'Add a photo source'}),
    h('div',{class:'row'},
      h('select',{style:'width:auto',on:{change:e=>d.type=e.target.value}},Object.values(SOURCE_TYPES).map(T=>h('option',{value:T.id,text:T.name,selected:T.id===d.type}))),
      h('input',{class:'grow',placeholder:'Label (optional)',value:d.label,on:{input:e=>d.label=e.target.value}}),
      h('input',{class:'grow',style:'flex:2',placeholder:SOURCE_TYPES[d.type].placeholder,value:d.link,on:{input:e=>d.link=e.target.value,keydown:e=>e.key==='Enter'&&addSource(a)}}),
      h('button',{class:'p',text:'Add source',on:{click:()=>addSource(a)}})))}

// ---- render
function render(){
  ['photos','cars','albums'].forEach(t=>$('#t-'+t).className=S.tab===t?'on':'');
  const sel=$('#albumSel');sel.replaceChildren(...S.albums.map(a=>h('option',{value:a.id,text:a.name||'(unnamed)'})));sel.value=S.albumId||'';sel.hidden=!S.user||!S.albums.length;
  const v=$('#view');v.replaceChildren();
  if(!S.user){v.append(h('div',{class:'empty',text:'Sign in with your Google account to open the shared log.'}));return}
  if(S.tab==='albums'){v.append(albumsView());return}
  const a=curAlbum();
  if(!a){v.append(h('div',{class:'empty'},'No albums yet. ',h('button',{class:'p',text:'Create your first album',on:{click:()=>{S.tab='albums';render()}}})));return}
  const oc=S.cars.filter(c=>!c.albumId).length,oh=legacyHidden().length;
  if(oc||oh)v.append(h('div',{class:'card'},h('p',{style:'margin:0 0 8px',text:`${oc} car(s) and ${oh} hidden photo(s) from before albums existed are not in any album yet.`}),h('button',{class:'p',text:`Move them into "${a.name}"`,on:{click:adopt}})));
  const here=carsHere();
  if(S.tab==='cars'){if(!here.length)v.append(h('div',{class:'empty',text:'No cars logged in this album yet. Open a photo to start.'}));here.forEach(c=>v.append(carForm(c)));return}
  const p=photo(S.sel);if(p){v.append(detail(p));return}
  if(!(a.sources||[]).length){v.append(h('div',{class:'empty'},'This album has no photo source yet. ',h('button',{class:'p',text:'Add one',on:{click:()=>{S.tab='albums';render()}}})));return}
  if(!S.photos.length){v.append(h('div',{class:'empty',text:'No photos loaded yet.'}));return}
  const vis=S.photos.filter(p=>(S.showVideos||!p.video)&&(S.showHidden||!hid(p)));
  const has=p=>here.some(c=>(c.photoGuids||[]).includes(p.guid));
  const done=vis.filter(has).length,nH=S.photos.filter(hid).length,nV=S.photos.filter(p=>p.video).length;
  const cb=(l,k)=>h('label',{style:'display:inline-flex;gap:6px;align-items:center;margin:0 14px 0 0;font-size:14px;color:var(--ink)'},h('input',{type:'checkbox',checked:S[k],style:'width:auto',on:{change:e=>{S[k]=e.target.checked;render()}}}),l);
  v.append(h('div',{class:'row',style:'margin-bottom:6px'},cb(`Show videos (${nV})`,'showVideos'),cb(`Show hidden (${nH})`,'showHidden')),
    h('p',{class:'mute',text:`${done} of ${vis.length} shown photos have cars logged · ${here.length} cars (${here.filter(c=>c.status==='confirmed').length} confirmed)`}),
    vis.length?h('div',{class:'grid'},vis.map(p=>{const n=here.filter(c=>(c.photoGuids||[]).includes(p.guid)).length,hd=hid(p);
      return h('div',{class:'th',style:hd?'opacity:.45':'',on:{click:()=>{S.sel=p.guid;render()}}},h('img',{src:p.url,loading:'lazy'}),
        p.video?h('span',{class:'badge',style:'right:auto;left:6px;bottom:auto;top:6px',text:'▶ video'}):null,
        h('span',{class:'badge'+(n||hd?'':' z'),text:hd?'hidden':(n?n+' 🚗':'todo')}))})):h('div',{class:'empty',text:'Nothing to show with these filters.'}))}
$('#t-photos').onclick=()=>{S.tab='photos';S.sel=null;render()};$('#t-cars').onclick=()=>{S.tab='cars';render()};$('#t-albums').onclick=()=>{S.tab='albums';render()};
$('#albumSel').onchange=e=>openAlbum(e.target.value);
render();
</script></body></html>
